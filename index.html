<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataSuite Enterprise</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;background:#1e1e1e;color:#cccccc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      #root{min-height:100vh}
      #ds-boot{
        position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;background:#1e1e1e;
        gap:12px;z-index:9999;transition:opacity 0.15s ease;
      }
      #ds-boot-logo{
        width:36px;height:36px;border-radius:8px;
        background:linear-gradient(135deg,#3B82F6,#8B5CF6);
        display:flex;align-items:center;justify-content:center;
        font-size:16px;font-weight:700;color:#fff;letter-spacing:-0.5px;
      }
      #ds-boot-spinner{
        width:20px;height:20px;border-radius:50%;
        border:2px solid #3c3c3c;border-top-color:#007acc;
        animation:ds-spin 0.7s linear infinite;
      }
      @keyframes ds-spin{to{transform:rotate(360deg)}}
      #ds-boot-label{font-size:11px;color:#6e6e6e;letter-spacing:0.04em}
    </style>
  </head>
  <body>
    <div id="ds-boot">
      <div id="ds-boot-logo">DS</div>
      <div id="ds-boot-spinner"></div>
      <div id="ds-boot-label">DataSuite Enterprise</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var boot = document.getElementById('ds-boot');
        if (!boot) return;
        var mo = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            boot.style.opacity = '0';
            setTimeout(function(){ if(boot.parentNode) boot.parentNode.removeChild(boot); }, 160);
            mo.disconnect();
          }
        });
        mo.observe(document.getElementById('root'), { childList: true });
        setTimeout(function(){
          boot.style.opacity = '0';
          setTimeout(function(){ if(boot.parentNode) boot.parentNode.removeChild(boot); }, 160);
        }, 4000);
      })();
    </script>
  </body>
</html>
